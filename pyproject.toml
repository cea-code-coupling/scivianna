[build-system]
requires = [
    'setuptools>=61.0',
    'wheel'
]
build-backend = "setuptools.build_meta"

[project]
name = "scivianna"
dynamic = ["version", "readme"]
description = "Python generic module to visualize simulation geometries and results."
requires-python = ">=3.8, <4"
authors = [
    {name = "CEA"}
]
maintainers = [
    {name = "Thibault Moulignier", email = "Thibault.Moulignier@cea.fr"}
]
keywords = ["visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "panel",
    "matplotlib",
    "numpy",
    "shapely",
    "holoviews",
    "panel_material_ui>=0.12.0",
    "geopandas<1.1",
    "dill",
    "pandas",
    "panel-splitjs"
]

[project.optional-dependencies]
default = []
medcoupling = [
    "medcoupling",
]
agent = [
    "smolagents[openai]",
]
grid = [
    "rasterio",
]
"3d" = [
    "pyvista",
    "scivianna-vtk>=0.1.11"
]
test = [
    "pytest-xdist",
    "flake8",
    "coverage",
    "pytest-cov",
    "nbmake",
]
coupling = [
    "medcoupling",
    "salome-c3po",
    "pydantic",
    "icoco~=2.0.0"
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-nb",
    "nbsphinx",
    "sphinx-autoapi"
]

[project.urls]
Homepage = "https://github.com/cea-code-coupling/scivianna"
Documentation = "https://scivianna.readthedocs.io"
Repository = "https://github.com/cea-code-coupling/scivianna"
"Bug Tracker" = "https://github.com/cea-code-coupling/scivianna/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scivianna = [
    "agent/*.py",
    "agent/*.md",
    "component/dist/*.js",
    "input_file/*",
    "icon/*.svg",
    "utils/*",
    "*.sh",
    "VERSION",
    "readme.md"
]
scivianna_example = [
    "c3po_coupling/*",
    "europe_grid/*",
    "image/*.png",
    "med/*",
    "mandelbrot/*",
    "*/README.md",
    "*.md"
]

[tool.setuptools.dynamic]
version = {file = "src/scivianna/VERSION"}
readme = {file = "src/scivianna/readme.md", content-type = "text/markdown"}

[tool.pytest.ini_options]
markers = [
    "default: basic tests without any dependencies or medcoupling related features",
    "medcoupling: More complex tests that require medcoupling to be installed",
    "pyvista: Tests for 3D plots and 3D extrusion",
    "coupling: Coupling tests that require CP3O to be installed",
    "agent: Tests for the Data2DWorker",
    "grid: Tests related to rasterio",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "if _testing:",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["scivianna", "scivianna_example"]
skip = ["__pycache__", "*.pyc", "*.pyo", ".git", ".tox", "build", "dist"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring (handled by our docs)
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "W0511",  # fixme (TODO comments)
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false  # Can be enabled later for stricter checking
exclude = [
    "tests/",
    "src/scivianna_example/"
]

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".tox",
]
per-file-ignores = [
    "__init__.py:F401",  # unused imports in __init__.py are OK
]
